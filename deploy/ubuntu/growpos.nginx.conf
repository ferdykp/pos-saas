# Install only after TLS certificates and PHP-FPM are configured.
server {
    listen 80;
    server_name growpos.com;
    return 301 https://growpos.com$request_uri;
}
server {
    listen 443 ssl;
    server_name growpos.com;
    root /srv/growpos/current/public;
    index index.php;
    ssl_certificate /etc/letsencrypt/live/growpos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/growpos.com/privkey.pem;
    client_max_body_size 10m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_hide_header X-Powered-By;
    }
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
    location ~* ^/storage/.*\.(php|phtml|phar)$ { deny all; }
}
